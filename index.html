<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c6cf0">
<title>StudyNest | Study planner for students</title>
<meta name="description" content="StudyNest is a calm study planner for students: timetable, exam prep with progress tracking, assignments, group projects and daily, weekly and monthly lists.">
<meta property="og:title" content="StudyNest">
<meta property="og:description" content="A calm study planner: timetable, exam prep progress, assignments and group projects.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#2d2a3e; --muted:#7a7690; --line:#ece7df;
  --brand:#7c6cf0; --brand-soft:#ece9ff; --peach:#ff9f7a; --peach-soft:#fff0e9;
  --ok:#2fb78a; --ok-soft:#e1f6ee; --warn:#e8962e; --warn-soft:#fff2de; --bad:#e5636b; --bad-soft:#fde8ea;
  --shadow:0 6px 22px rgba(70,60,120,.08); --radius:18px;
}
:root[data-theme=dark]{
  --bg:#1e1c2b; --card:#2a2840; --ink:#ece9fa; --muted:#a29fbd; --line:#3a3756;
  --brand:#9d90ff; --brand-soft:#37335a; --peach:#ffab8a; --peach-soft:#433434;
  --ok:#4fd1a5; --ok-soft:#254440; --warn:#f0b05a; --warn-soft:#46391f; --bad:#f08088; --bad-soft:#4a2a30;
  --shadow:0 6px 22px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.5 "Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:0 10px 16px}
.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--peach));color:#fff;font-size:20px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;border-radius:14px;cursor:pointer;font-weight:700;color:var(--muted);text-align:left;width:100%}
.nav span{font-size:20px;width:26px;text-align:center}
.nav:hover{background:var(--brand-soft);color:var(--brand)}
.nav.on{background:var(--brand-soft);color:var(--brand)}
.nav .dot{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.top h1{font-size:26px;flex:1}
.icon{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:19px;box-shadow:var(--shadow)}
.icon .badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:1px 6px}
/* generic */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.hero{background:linear-gradient(135deg,var(--brand),#a58bff 55%,var(--peach));color:#fff;border:0;padding:26px 28px;margin-bottom:18px}
.hero h2{font-size:28px}
.hero p{margin:6px 0 0;opacity:.95}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.pill{background:rgba(255,255,255,.22);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:10px 16px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer;min-height:42px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.warn{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none;cursor:pointer}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.dotc{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;padding:4px 8px;border-radius:8px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.bar{height:11px;border-radius:99px;background:var(--brand-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--peach));transition:width .4s}
.bar.full i{background:linear-gradient(90deg,var(--ok),#7ad9b6)}
.barrow{display:flex;align-items:center;gap:10px}.barrow .bar{flex:1}.barrow b{min-width:44px;text-align:right}
.empty{text-align:center;color:var(--muted);padding:18px 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 16px;font-weight:800;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.course-card{border-top:6px solid var(--c,var(--brand));cursor:pointer;transition:transform .15s}
.course-card:hover{transform:translateY(-3px)}
.back{border:0;background:none;color:var(--brand);font-weight:800;cursor:pointer;padding:0 0 12px;font-size:15px}
.group{margin:18px 0 6px;font-weight:800;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.8px}
.group.bad{color:var(--bad)}
.topic{padding:8px 0;border-bottom:1px solid var(--line)}
.subs{margin:6px 0 0 34px;display:grid;gap:4px}
.sub{display:flex;align-items:center;gap:10px}
.avatar{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:13px;flex:none}
.avatars{display:flex}.avatars .avatar{margin-right:-8px;border:2px solid var(--card)}
.inline{display:flex;gap:8px;margin-top:10px}.inline input{flex:1}
/* modal */
dialog.modal{border:0;border-radius:22px;padding:0;width:min(480px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(30,25,60,.45)}
dialog .inner{padding:22px;display:grid;gap:12px;max-height:86vh;overflow:auto}
dialog label{display:grid;gap:5px;font-weight:700;font-size:14px}
/* calendar */
.week{display:grid;grid-template-columns:46px repeat(7,minmax(96px,1fr));min-width:780px}
.wk-scroll{overflow-x:auto}
.wk-head{padding:6px 4px;text-align:center;font-weight:800;border-bottom:2px solid var(--line)}
.wk-head.today{color:var(--brand)}
.wk-head small{display:block;font-weight:600;color:var(--muted)}
.wk-all{padding:4px;border-bottom:1px solid var(--line);min-height:34px;display:grid;gap:3px;align-content:start}
.chipx{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:8px;background:var(--brand-soft);color:var(--brand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:4px solid var(--c,var(--brand))}
.wk-col{position:relative;border-left:1px solid var(--line)}
.wk-hours div{height:var(--ph);font-size:11px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-8px)}
.blk{position:absolute;left:3px;right:3px;border-radius:10px;padding:4px 7px;font-size:12px;font-weight:800;color:#fff;overflow:hidden;background:var(--c);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.blk small{display:block;font-weight:600;opacity:.92}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mh{text-align:center;font-weight:800;color:var(--muted);font-size:13px}
.cell{min-height:92px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;display:grid;align-content:start;gap:3px}
.cell:hover{border-color:var(--brand)}
.cell.other{opacity:.45}.cell.today{border:2px solid var(--brand);background:var(--brand-soft)}
.cell b{font-size:13px}
.more{font-size:11px;color:var(--muted);font-weight:700}
/* bell panel */
.panel{position:fixed;top:70px;right:24px;width:min(380px,92vw);max-height:70vh;overflow:auto;z-index:20;background:var(--card);border-radius:18px;box-shadow:0 14px 50px rgba(0,0,0,.25);border:1px solid var(--line);padding:16px 18px}
.confetti{position:fixed;pointer-events:none;z-index:60;font-size:26px;animation:fly 1.4s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),-240px) rotate(300deg)}}
.file{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.file:last-child{border-bottom:0}
/* assistant */
#assistant{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.ask-fab{width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 8px 26px rgba(124,108,240,.45)}
.ask-fab:hover{filter:brightness(1.08)}
.ask-panel{width:min(400px,94vw);height:min(560px,70vh);display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 50px rgba(0,0,0,.28);overflow:hidden}
.ask-panel header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--brand-soft);border-bottom:1px solid var(--line)}
.ask-panel header>div{flex:1;display:grid}.ask-panel header small{color:var(--muted);font-weight:600;font-size:12px}
.ask-msgs{flex:1;overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}
.ask-msgs .m{max-width:94%;padding:9px 12px;border-radius:16px;font-size:14.5px;overflow-wrap:anywhere}
.ask-msgs .m p{margin:0 0 6px}.ask-msgs .m p:last-child{margin:0}
.ask-msgs .me{justify-self:end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.ask-msgs .bot{justify-self:start;background:var(--bg,var(--brand-soft));border:1px solid var(--line);border-bottom-left-radius:4px;width:94%}
.ask-msgs .bot .item{padding:7px 0}
.acard{padding:8px 0;border-top:1px solid var(--line)}.acard:first-of-type{border-top:0}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugs .chip{padding:4px 12px;font-size:13px;margin:0;text-align:left}
.ask-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.ask-form input{flex:1;min-width:0}
@media(max-width:900px){
  #assistant{right:12px;bottom:calc(86px + env(safe-area-inset-bottom))}
  .ask-panel{height:min(520px,64vh)}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;z-index:15;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);gap:2px}
  .logo{display:none}
  .nav{flex-direction:column;gap:0;padding:6px 10px;font-size:11px;width:auto;min-width:64px;text-align:center}
  .nav .dot{position:absolute;margin:0;transform:translate(14px,-4px)}
  .nav{position:relative}
  main{padding:16px 14px 100px}
  .top h1{font-size:22px}
  .hero h2{font-size:23px}
  .card .row>h2{flex:1 1 100%!important;font-size:21px}
  .panel{right:10px;top:64px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ============ helpers ============ */
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAYS_LONG = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const COLORS = ['#7c6cf0', '#ff8a65', '#2fb7a3', '#f2a93b', '#e86a9a', '#4aa3e8', '#8bc34a', '#9575cd'];
const QUOTES = [
  'Small steps every day add up to big results.',
  'You do not have to be perfect, just keep going.',
  'Future you will thank you for studying today.',
  'Progress, not perfection.',
  'One topic at a time. You have got this!',
  'Start with the easiest topic to build momentum.',
  'A 25-minute focus session beats a 3-hour worry.',
  'Done is better than perfect. Tick one thing off!',
  'Rest is part of studying too. Take breaks.',
  'You are closer than you think.',
];
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const dayIdx = (d) => (d.getDay() + 6) % 7;            // Monday = 0
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = (d) => addDays(d, -dayIdx(d));
const daysUntil = (s) => Math.round((parseISO(s) - parseISO(todayISO())) / 864e5);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (s) => parseISO(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const fmtLong = (d) => d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtSize = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

function rel(dateStr) {
  const n = daysUntil(dateStr);
  if (n < -1) return { text: `${-n} days overdue`, cls: 'bad' };
  if (n === -1) return { text: '1 day overdue', cls: 'bad' };
  if (n === 0) return { text: 'Today', cls: 'bad' };
  if (n === 1) return { text: 'Tomorrow', cls: 'warn' };
  if (n <= 3) return { text: `In ${n} days`, cls: 'warn' };
  if (n <= 14) return { text: `In ${n} days`, cls: '' };
  return { text: fmtDate(dateStr), cls: 'ok' };
}
function periodKey(kind) {
  const now = new Date();
  if (kind === 'daily') return iso(now);
  if (kind === 'weekly') return 'W' + iso(mondayOf(now));
  return 'M' + now.getFullYear() + '-' + pad(now.getMonth() + 1);
}

/* ============ state + storage ============ */
const KEY = 'studynest.v1';
function defaults() {
  return { name: '', theme: 'light', courses: [], exams: [], tasks: [], projects: [], files: [], lists: { daily: [], weekly: [], monthly: [] } };
}
let S = (function load() {
  try { const j = JSON.parse(localStorage.getItem(KEY)); if (j) return Object.assign(defaults(), j); } catch (e) {}
  return defaults();
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function commit() { save(); render(); }

/* lookups */
const courseOf = (id) => S.courses.find((c) => c.id === id);
const colorOf = (id) => (courseOf(id) || {}).color || '#9a95b5';
const nameOf = (id) => (courseOf(id) || {}).name || '';

/* progress */
function leaves(e) {
  let t = 0, d = 0;
  for (const tp of e.topics) {
    if (tp.subs && tp.subs.length) for (const s of tp.subs) { t++; if (s.done) d++; }
    else { t++; if (tp.done) d++; }
  }
  return { t, d, p: t ? Math.round((d / t) * 100) : 0 };
}
function projProgress(p) {
  const t = p.tasks.length, d = p.tasks.filter((x) => x.done).length;
  return { t, d, p: t ? Math.round((d / t) * 100) : 0 };
}
const bar = (p) => `<div class="bar ${p >= 100 ? 'full' : ''}"><i style="width:${p}%"></i></div>`;
const barRow = (p, label) => `<div class="barrow">${bar(p)}<b>${label ?? p + '%'}</b></div>`;

/* deadlines (everything with a date that is not finished) */
function deadlines() {
  const out = [];
  for (const t of S.tasks) if (!t.done && t.due) out.push({ kind: 'task', title: t.title, date: t.due, course: t.courseId, go: 'tasks' });
  for (const p of S.projects) {
    if (!p.done && p.due) out.push({ kind: 'project', title: p.title, date: p.due, course: p.courseId, go: 'project:' + p.id });
    for (const x of p.tasks) if (!x.done && x.due) out.push({ kind: 'ptask', title: `${x.title} (${p.title})`, date: x.due, course: p.courseId, go: 'project:' + p.id });
  }
  for (const e of S.exams) out.push({ kind: 'exam', title: examTitle(e), date: e.date, course: e.courseId, go: 'exam:' + e.id, time: e.time });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
const examTitle = (e) => (e.title || `${nameOf(e.courseId) || 'Course'} ${e.type}`).trim();
const KIND_ICON = { task: '✅', project: '👥', ptask: '🧩', exam: '📝' };
function reminders() {
  return deadlines().filter((d) => {
    const n = daysUntil(d.date);
    return d.kind === 'exam' ? n >= 0 && n <= 14 : n <= 7;
  });
}
function urgentCount() { return reminders().filter((d) => daysUntil(d.date) <= 2).length; }

/* ============ small UI helpers ============ */
function confetti() {
  const em = ['🎉', '✨', '⭐', '🌟', '💜', '🎊'];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.className = 'confetti'; s.textContent = em[i % em.length];
    s.style.left = 30 + Math.random() * 40 + 'vw'; s.style.top = '60vh';
    s.style.setProperty('--dx', (Math.random() * 300 - 150) + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1500);
  }
}
function openModal(html) {
  const d = document.createElement('dialog'); d.className = 'modal';
  d.innerHTML = `<div class="inner">${html}</div>`;
  d.addEventListener('close', () => d.remove());
  document.body.appendChild(d); d.showModal(); return d;
}
function fieldHTML(f, v) {
  const val = v ?? f.value ?? '';
  let input;
  if (f.type === 'select') input = `<select name="${f.name}" ${f.required ? 'required' : ''}>${f.options.map((o) => `<option value="${esc(o.v)}" ${o.v === val ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
  else if (f.type === 'textarea') input = `<textarea name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(val)}</textarea>`;
  else input = `<input type="${f.type || 'text'}" name="${f.name}" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}" ${f.required ? 'required' : ''} ${f.type === 'color' ? '' : 'autocomplete="off"'}>`;
  return `<label>${esc(f.label)}${input}</label>`;
}
function formDialog(title, fields, values, onOk) {
  const d = openModal(`<h3>${esc(title)}</h3><form>${fields.map((f) => fieldHTML(f, values[f.name])).join('<div style="height:12px"></div>')}<div class="row end" style="margin-top:16px"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn">Save</button></div></form>`);
  $('[data-close]', d).onclick = () => d.close();
  $('form', d).onsubmit = (e) => {
    e.preventDefault();
    const vals = Object.fromEntries(new FormData(e.target).entries());
    for (const k in vals) if (typeof vals[k] === 'string') vals[k] = vals[k].trim();
    d.close(); onOk(vals);
  };

/* ============ files (blobs live in IndexedDB, names in state) ============ */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('studynest-files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => { const t = db.transaction('f', mode); const q = fn(t.objectStore('f')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); });
}
async function addFiles(owner, fileList) {
  for (const f of fileList) {
    if (f.size > 15 * 1048576) { alert(`"${f.name}" is bigger than 15 MB.`); continue; }
    const id = uid();
    try { await idbDo('readwrite', (s) => s.put(f, id)); } catch (e) { alert('Could not store the file in this browser.'); return; }
    S.files.push({ id, owner, name: f.name, size: f.size });
  }
  commit();
}
async function downloadFile(id) {
  const meta = S.files.find((f) => f.id === id); if (!meta) return;
  try {
    const blob = await idbDo('readonly', (s) => s.get(id));
    if (!blob) return alert('File not found in this browser.');
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = meta.name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { alert('Could not open the file.'); }
}
async function removeFile(id) {
  try { await idbDo('readwrite', (s) => s.delete(id)); } catch (e) {}
  S.files = S.files.filter((f) => f.id !== id); commit();
}
function filesBox(owner) {
  const list = S.files.filter((f) => f.owner === owner);
  return `<div>${list.map((f) => `<div class="file"><span>📎</span><div class="body" style="flex:1;min-width:0"><div class="t" style="overflow-wrap:anywhere">${esc(f.name)}</div><div class="small muted">${fmtSize(f.size)}</div></div><button class="btn ghost sm" data-act="file-dl" data-id="${f.id}">Open</button><button class="x" data-act="file-del" data-id="${f.id}" aria-label="Delete file">🗑</button></div>`).join('') || '<div class="muted small" style="padding:4px 0 8px">No files yet. Upload lecture notes, slides or PDFs.</div>'}
  <label class="btn ghost sm" style="margin-top:8px;cursor:pointer">⬆ Upload files<input type="file" multiple hidden data-upload="${esc(owner)}"></label></div>`;
}

  const quote = QUOTES[(now.getDate() + now.getMonth()) % QUOTES.length];
  const weekEnd = iso(addDays(now, 6));
  const dueWeek = deadlines().filter((d) => d.date >= todayISO() && d.date <= weekEnd).length;
  const upcoming = S.exams.filter((e) => daysUntil(e.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
  let T = 0, D = 0; upcoming.forEach((e) => { const l = leaves(e); T += l.t; D += l.d; });
  const prep = T ? Math.round((D / T) * 100) : null;
  const classes = [];
  S.courses.forEach((c) => c.slots.forEach((s) => { if (s.day === dayIdx(now)) classes.push({ c, s }); }));

  const nowMin = now.getHours() * 60 + now.getMinutes();
  const dk = periodKey('daily'), daily = S.lists.daily, dDone = daily.filter((i) => i.doneOn === dk).length;

    <div class="pills"><span class="pill">📌 ${dueWeek} due this week</span>${prep !== null ? `<span class="pill">📖 ${prep}% exam topics done</span>` : ''}<span class="pill">☀️ ${dDone}/${daily.length} daily tasks</span></div></div>`;

  const dailyCard = `<div class="card"><h3>☀️ Today's checklist <span class="sp"></span><span class="small muted">${dDone}/${daily.length}</span></h3>${daily.length ? barRow(Math.round(dDone / daily.length * 100)) : ''}${listItems('daily')}

function viewTasks() {

    Object.values(g).forEach((a) => a.sort((x, y) => (x.due || '9').localeCompare(y.due || '9')));

/* ============ CALENDAR ============ */
function viewCalendar() {
  const wk = mondayOf(calAnchor);
  const mo = new Date(calAnchor.getFullYear(), calAnchor.getMonth(), 1);
  const label = calMode === 'week' ? `${fmtDate(iso(wk))} – ${fmtDate(iso(addDays(wk, 6)))}` : mo.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const head = `<div class="row" style="margin-bottom:16px"><div class="chips" style="margin:0">${['week', 'month'].map((m) => `<button class="chip ${calMode === m ? 'on' : ''}" data-act="cal-mode" data-k="${m}">${m === 'week' ? 'Week' : 'Month'}</button>`).join('')}</div><span class="sp"></span>
    <button class="btn ghost sm" data-act="cal-nav" data-n="-1">◀</button><b style="min-width:140px;text-align:center">${label}</b><button class="btn ghost sm" data-act="cal-nav" data-n="1">▶</button><button class="btn sm" data-act="cal-today">Today</button></div>`;
  return head + (calMode === 'week' ? weekGrid(wk) : monthGrid(mo));
}
function weekGrid(wk) {
  let minH = 8, maxH = 17;
  S.courses.forEach((c) => c.slots.forEach((s) => { minH = Math.min(minH, Math.floor(toMin(s.start) / 60)); maxH = Math.max(maxH, Math.ceil(toMin(s.end) / 60)); }));
  const ph = 52, hours = maxH - minH, dl = deadlines(), t0 = todayISO();
  let cols = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(wk, i), ds = iso(d);
    const chips = dl.filter((x) => x.date === ds).map((x) => `<div class="chipx" style="--c:${colorOf(x.course)}" data-act="go" data-view="${x.go}" title="${esc(x.title)}">${KIND_ICON[x.kind]} ${esc(x.title)}</div>`).join('');
    const blocks = S.courses.flatMap((c) => c.slots.filter((s) => s.day === i).map((s) => `<div class="blk" style="--c:${c.color};top:${(toMin(s.start) - minH * 60) / 60 * ph}px;height:${Math.max(24, (toMin(s.end) - toMin(s.start)) / 60 * ph - 2)}px">${esc(c.name)}<small>${s.start}–${s.end}${s.room ? ' · ' + esc(s.room) : ''}</small></div>`)).join('');
    cols += `<div style="min-width:0"><div class="wk-head ${ds === t0 ? 'today' : ''}" data-act="day" data-d="${ds}" style="cursor:pointer">${DAYS[i]}<small>${d.getDate()}</small></div><div class="wk-all">${chips}</div><div class="wk-col" style="height:${hours * ph}px;background:repeating-linear-gradient(var(--line) 0 1px,transparent 1px ${ph}px)">${blocks}</div></div>`;
  }
  const hourCol = `<div><div class="wk-head">&nbsp;<small>&nbsp;</small></div><div class="wk-all"></div><div class="wk-hours" style="--ph:${ph}px">${Array.from({ length: hours }, (_, k) => `<div>${pad(minH + k)}:00</div>`).join('')}</div></div>`;
  return `<div class="card wk-scroll" style="padding:12px"><div class="week">${hourCol}${cols}</div></div>`;
}
function monthGrid(mo) {
  const start = mondayOf(mo), dl = deadlines(), t0 = todayISO();
  const rows = Math.ceil((dayIdx(mo) + new Date(mo.getFullYear(), mo.getMonth() + 1, 0).getDate()) / 7);
  let cells = '';
  for (let i = 0; i < rows * 7; i++) {
    const d = addDays(start, i), ds = iso(d), items = dl.filter((x) => x.date === ds);
    cells += `<div class="cell ${d.getMonth() !== mo.getMonth() ? 'other' : ''} ${ds === t0 ? 'today' : ''}" data-act="day" data-d="${ds}"><b>${d.getDate()}</b>${items.slice(0, 2).map((x) => `<div class="chipx" style="--c:${colorOf(x.course)}">${KIND_ICON[x.kind]} ${esc(x.title)}</div>`).join('')}${items.length > 2 ? `<div class="more">+${items.length - 2} more</div>` : ''}</div>`;
  }
  return `<div class="month" style="margin-bottom:6px">${DAYS.map((d) => `<div class="mh">${d}</div>`).join('')}</div><div class="month">${cells}</div>`;
}
function dayDialog(ds) {
  const d = parseISO(ds), cls = [];
  S.courses.forEach((c) => c.slots.forEach((s) => { if (s.day === dayIdx(d)) cls.push({ c, s }); }));
  cls.sort((a, b) => a.s.start.localeCompare(b.s.start));
  const items = deadlines().filter((x) => x.date === ds);
  const dlg = openModal(`<h3>${fmtLong(d)}</h3>${cls.length ? `<div class="group" style="margin-top:0">Classes</div>${cls.map(({ c, s }) => `<div class="item"><span class="dotc" style="background:${c.color}"></span><div class="body"><div class="t">${esc(c.name)}</div><div class="small muted">${s.start} – ${s.end}${s.room ? ' · ' + esc(s.room) : ''}</div></div></div>`).join('')}` : ''}
    ${items.length ? `<div class="group">Due</div>${items.map((x) => `<div class="item" style="cursor:pointer" data-act="go-close" data-view="${x.go}"><span style="font-size:20px">${KIND_ICON[x.kind]}</span><div class="body"><div class="t">${esc(x.title)}</div>${courseTag(x.course)}</div></div>`).join('')}` : ''}
    ${!cls.length && !items.length ? '<div class="empty">Nothing planned. 🌿</div>' : ''}
    <div class="row end"><button class="btn ghost" data-close>Close</button><button class="btn" data-act="task-add" data-due="${ds}" data-closeall>➕ Add task</button></div>`);
  $$('[data-close]', dlg).forEach((b) => (b.onclick = () => dlg.close()));
}

/* ============ ASSISTANT ============
   A rule-based question answering helper ("Ask StudyNest").
   No AI model, no network, no API key: it classifies the question with keyword
   rules (English and Turkish) and answers by querying the planner data in `S`.
   Pipeline:  question -> understand() -> intent + entities -> answer builder -> HTML
   The two stages are separate on purpose, so a language model could later replace
   understand() without touching the answer builders. */

/* ---------- text helpers ---------- */
const fold = (s) => String(s || '').toLowerCase().replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, '');
const tokens = (s) => fold(s).split(/[^a-z0-9]+/).filter(Boolean);
const STOP = new Set(['and', 'the', 'for', 'ile', 'ders', 'dersi', 'course', 'class']);

/* keyword lists, folded to ASCII, matched as word prefixes so that Turkish suffixes work
   (odev -> odevim, odevler; sinav -> sinavda) */
const W = {
  help: ['help', 'yardim', 'what can you', 'ne sorabilirim', 'neler yapabilirsin'],
  exam: ['exam', 'sinav', 'vize', 'midterm', 'final', 'quiz'],
  topic: ['topic', 'konu', 'subtopic', 'covered', 'cover', 'icerik', 'chapter', 'cikacak', 'cikar', 'syllabus'],
  progress: ['progress', 'ilerleme', 'percent', 'yuzde', 'tamamlan', 'completed', 'finished', 'bitir', 'remaining', 'kalan', 'how far', 'ne kadar'],
  weak: ['lowest', 'weak', 'least', 'behind', 'geride', 'dusuk', 'should i study', 'should i start', 'study first', 'what to study', 'ne calis', 'neye calis', 'nereden basla', 'oncelik', 'priority', 'recommend', 'oner'],
  task: ['homework', 'assignment', 'task', 'odev', 'gorev', 'todo', 'to-do', 'to do', 'yapilacak'],
  due: ['deadline', 'due', 'teslim', 'son tarih'],
  overdue: ['overdue', 'late', 'gecik', 'kacir', 'missed'],
  project: ['project', 'proje', 'group', 'grup', 'team', 'ekip', 'takim'],
  classes: ['class', 'lecture', 'schedule', 'timetable', 'program', 'room', 'derslik', 'sinif', 'hangi gun', 'ders'],
  mine: ['assigned', 'atan', 'bana'],
  next: ['next', 'nearest', 'closest', 'upcoming', 'soon', 'yakin', 'siradaki'],
  today: ['today', 'bugun'],
  tomorrow: ['tomorrow', 'yarin'],
  week: ['week', 'hafta'],
  summary: ['summary', 'overview', 'ozet', 'status', 'durum', 'how am i doing', 'nasil gidiyor'],
};

function understand(raw) {
  const q = fold(raw);
  const any = (key) => W[key].some((w) => new RegExp('(^|[^a-z0-9])' + w.replace(/[-]/g, '\\-')).test(q));
  const words = tokens(raw);
  const f = {};
  for (const k in W) f[k] = any(k);
  f.greet = /^(hi|hello|hey|hola|merhaba|selam|gunaydin)\b/.test(q) && words.length <= 3;
  const courses = S.courses.filter((c) => {
    const t = tokens(c.name).filter((x) => x.length >= 3 && !STOP.has(x));
    return t.some((x) => words.some((w) => w.startsWith(x) || (w.length >= 4 && x.startsWith(w))));
  });
  const type = /midterm|vize/.test(q) ? 'Midterm' : /final/.test(q) ? 'Final' : /quiz/.test(q) ? 'Quiz' : null;
  const names = [...new Set(S.projects.flatMap((p) => p.members.map((m) => fold(m.name))))];
  const member = names.find((n) => n && words.includes(n)) || null;
  return { q, raw, words, f, courses, type, member };
}

/* ---------- small renderers ---------- */
const P = (s) => `<p>${s}</p>`;
const goLink = (view, label) => `<button class="btn ghost sm" data-act="go" data-view="${view}">${label}</button>`;
const upcomingExams = () => S.exams.filter((e) => daysUntil(e.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
const examLine = (e) => `<div class="item" style="cursor:pointer" data-act="go" data-view="exam:${e.id}"><span style="font-size:20px">📝</span><div class="body"><div class="t">${esc(examTitle(e))}</div><div class="small muted">${fmtDate(e.date)}${e.time ? ' · ' + esc(e.time) : ''}${e.place ? ' · ' + esc(e.place) : ''}</div></div>${dueTag(e.date)}</div>`;
const topicMark = (tp) => {
  if (tp.subs && tp.subs.length) { const d = tp.subs.filter((s) => s.done).length; return d === tp.subs.length ? '✅' : d ? '🟡' : '⬜'; }
  return tp.done ? '✅' : '⬜';
};
function examTopicsBlock(e) {
  const l = leaves(e);
  const body = e.topics.length
    ? e.topics.map((tp) => `<div class="small" style="padding:3px 0">${topicMark(tp)} <b>${esc(tp.title)}</b>${tp.subs && tp.subs.length ? `<div class="muted" style="margin-left:24px">${tp.subs.map((s) => (s.done ? '✅ ' : '⬜ ') + esc(s.title)).join('<br>')}</div>` : ''}</div>`).join('')
    : '<div class="small muted">No topics added yet. Open the exam and add what will be asked.</div>';
  return `<div class="acard"><div class="row"><b>${esc(examTitle(e))}</b><span class="sp"></span>${dueTag(e.date)}</div>${l.t ? barRow(l.p, `${l.d}/${l.t} · ${l.p}%`) : ''}${body}<div style="margin-top:8px">${goLink('exam:' + e.id, 'Open exam')}</div></div>`;
}

/* ---------- answer builders ---------- */
function pickExams(u) {
  let ex = S.exams.slice();
  if (u.courses.length) ex = ex.filter((e) => u.courses.some((c) => c.id === e.courseId));
  if (u.type) ex = ex.filter((e) => e.type === u.type);
  const named = ex.filter((e) => e.title && u.q.includes(fold(e.title)));
  if (named.length) ex = named;
  const up = ex.filter((e) => daysUntil(e.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
  return up.length ? up : ex.sort((a, b) => b.date.localeCompare(a.date));
}
function aExamTopics(u) {
  const ex = pickExams(u);
  if (!ex.length) return P('I could not find a matching exam. Add one in the <b>Exams</b> tab.');
  const shown = u.f.next ? ex.slice(0, 1) : ex.slice(0, 3);
  return P(shown.length === 1 ? 'Here is what is on this exam:' : 'Here are the topics:') + shown.map(examTopicsBlock).join('') + (ex.length > shown.length ? P(`<span class="muted">+ ${ex.length - shown.length} more exam(s) match.</span>`) : '');
}
function aExamList(u) {
  const ex = pickExams(u);
  if (!ex.length) return P('You have no exams yet. Add one in the <b>Exams</b> tab.');
  const shown = u.f.next ? ex.slice(0, 1) : ex.slice(0, 5);
  const first = shown[0], l = leaves(first), n = daysUntil(first.date);
  const lead = n >= 0 ? `Your ${u.f.next ? 'next' : 'closest'} exam is <b>${esc(examTitle(first))}</b>, ${n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'}.` : `The latest exam I found is <b>${esc(examTitle(first))}</b> (already passed).`;
  return P(lead + (l.t ? ` You have finished ${l.p}% of its topics.` : '')) + shown.map(examLine).join('');
}
function aProgress(u) {
  const ex = (u.courses.length ? upcomingExams().filter((e) => u.courses.some((c) => c.id === e.courseId)) : upcomingExams());
  if (!ex.length) return P('There are no upcoming exams to measure. Add an exam and its topics first.');
  let T = 0, D = 0; ex.forEach((e) => { const l = leaves(e); T += l.t; D += l.d; });
  const rows = ex.map((e) => { const l = leaves(e); return `<div style="padding:6px 0"><div class="row small"><b>${esc(examTitle(e))}</b><span class="sp"></span>${dueTag(e.date)}</div>${l.t ? barRow(l.p, `${l.d}/${l.t} · ${l.p}%`) : '<div class="small muted">No topics yet</div>'}</div>`; }).join('');
  return P(T ? `Overall you have finished <b>${Math.round(D / T * 100)}%</b> of your exam topics (${D} of ${T}).` : 'No topics have been added yet.') + rows;
}
function aStudy(u) {
  const ex = (u.courses.length ? upcomingExams().filter((e) => u.courses.some((c) => c.id === e.courseId)) : upcomingExams());
  const todo = [];
  ex.forEach((e) => e.topics.forEach((tp) => {
    if (tp.subs && tp.subs.length) tp.subs.filter((s) => !s.done).forEach((s) => todo.push({ e, text: `${tp.title}: ${s.title}` }));
    else if (!tp.done) todo.push({ e, text: tp.title });
  }));
  const over = deadlines().filter((d) => d.kind !== 'exam' && daysUntil(d.date) < 0);
  let out = '';
  if (over.length) out += P(`First, ${over.length} task${over.length > 1 ? 's are' : ' is'} overdue: <b>${over.slice(0, 3).map((d) => esc(d.title)).join(', ')}</b>.`);
  if (todo.length) {
    const first = todo[0].e;
    out += P(`Your next exam is <b>${esc(examTitle(first))}</b>, ${dueTag(first.date)}. Start with these topics:`) + todo.filter((t) => t.e === first).slice(0, 5).map((t) => `<div class="small" style="padding:3px 0">⬜ ${esc(t.text)}</div>`).join('');
    const withTopics = ex.filter((e) => leaves(e).t); withTopics.sort((a, b) => leaves(a).p - leaves(b).p);
    if (withTopics.length > 1) out += P(`Lowest progress: <b>${esc(examTitle(withTopics[0]))}</b> at ${leaves(withTopics[0]).p}%.`);
  } else if (!over.length) out += P('You are all caught up: no open exam topics and no overdue tasks. 🌿');
  return out;
}
function dueRows(list, cap) {
  return list.slice(0, cap).map(reminderRow).join('') + (list.length > cap ? `<div class="small muted" style="padding-top:6px">+ ${list.length - cap} more</div>` : '');
}
function aDue(u) {
  const t = todayISO(), f = u.f;
  let list = deadlines().filter((d) => !(d.kind === 'exam' && d.date < t));
  if (f.task && !f.due) list = list.filter((d) => d.kind !== 'exam');
  if (u.courses.length) list = list.filter((d) => u.courses.some((c) => c.id === d.course));
  let lead;
  if (f.today) { list = list.filter((d) => d.date === t); lead = 'Due today:'; }
  else if (f.tomorrow) { list = list.filter((d) => d.date === iso(addDays(new Date(), 1))); lead = 'Due tomorrow:'; }
  else if (f.week) { const end = iso(addDays(new Date(), 6)); list = list.filter((d) => d.date <= end); lead = 'Due in the next 7 days (overdue items first):'; }
  else if (f.next) {
    const over = list.filter((d) => d.date < t).length;
    list = list.filter((d) => d.date >= t).slice(0, 1);
    lead = (list.length ? 'Your nearest deadline:' : 'Nothing is coming up.') + (over ? ` (You also have ${over} overdue.)` : '');
  } else lead = 'Here is what is coming up:';
  if (!list.length && !f.next) return P(lead.replace(':', '') + ': nothing. Enjoy the calm! 🌿');
  return P(lead) + dueRows(list, 6);
}
function aOverdue() {
  const over = deadlines().filter((d) => d.kind !== 'exam' && daysUntil(d.date) < 0);
  return over.length ? P(`You have <b>${over.length}</b> overdue item${over.length > 1 ? 's' : ''}:`) + dueRows(over, 8) : P('Nothing is overdue. Nice work! 🎉');
}
function aProject(u) {
  const list = S.projects.filter((p) => !p.done && (!u.courses.length || u.courses.some((c) => c.id === p.courseId))).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
  if (!list.length) return P('You have no open group projects. Add one in the <b>Projects</b> tab.');
  const shown = u.f.next ? list.slice(0, 1) : list.slice(0, 4);
  return P(u.f.next ? 'Your nearest project:' : 'Your open projects:') + shown.map((p) => {
    const pr = projProgress(p);

function aMember(u) {

const slotText = (s) => `${DAYS[s.day]} ${s.start} – ${s.end}${s.room ? ' · ' + esc(s.room) : ''}`;

function aCourse(c) {

function aSummary() {
  const t = todayISO(), open = S.tasks.filter((x) => !x.done), over = open.filter((x) => x.due && x.due < t);

const HELP_EXAMPLES = ['What is due this week?', 'When is my next exam?', 'What topics are in the Data Structures midterm?', 'What should I study first?', 'Show my overdue tasks', 'What are my classes today?', 'What is my nearest project?', 'Which tasks are assigned to Mert?'];
function aHelp() {
  return P('I answer questions from <b>your own planner data</b>. I am rule-based, so I do not need internet or an account. Try things like:') + `<div class="sugs">${HELP_EXAMPLES.map(sug).join('')}</div>` + P('<span class="muted small">English and Turkish both work (e.g. "en yakın sınav ne zaman?").</span>');
}
const sug = (q) => `<button class="chip sm" data-act="ask" data-q="${esc(q)}">${esc(q)}</button>`;

function assistantAnswer(raw) {
  const u = understand(raw), f = u.f;
  if (!u.q.trim()) return aHelp();
  if (f.help) return aHelp();
  const empty = !S.courses.length && !S.exams.length && !S.tasks.length && !S.projects.length;
  if (f.greet) return P(`Hi${S.name ? ' ' + esc(S.name) : ''}! 👋 Ask me about your deadlines, exam topics or progress.`) + `<div class="sugs">${['What is due this week?', 'When is my next exam?', 'What should I study first?'].map(sug).join('')}</div>`;
  if (empty) return P('Your planner is empty, so I have nothing to look at yet. Add a course, or try the sample data:') + '<button class="btn sm" data-act="sample">✨ Load sample data</button>';
  if (f.overdue && !f.exam) return aOverdue();
  if (f.weak) return aStudy(u);
  if ((u.member || f.mine) && (f.task || f.project)) return aMember(u);
  if (f.project && !f.exam) return aProject(u);
  if (f.exam && (f.topic || f.progress)) return aExamTopics(u);
  if (f.exam) return aExamList(u);
  if (f.topic) return aExamTopics(u);
  if (f.progress) return aProgress(u);
  if (f.task || f.due || (f.next && !f.classes)) return aDue(u);
  if (f.classes) return aClasses(u);
  if (f.today || f.tomorrow) return aClasses(u) + aDue(u);
  if (u.courses.length) return u.courses.slice(0, 3).map(aCourse).join('');
  if (f.summary) return aSummary();
  if (f.week) return aDue(u);
  return P('Hmm, I did not understand that one. I can answer questions about deadlines, exams and their topics, progress, classes, projects and courses. For example:') + `<div class="sugs">${HELP_EXAMPLES.slice(0, 5).map(sug).join('')}</div>`;
}

function assistDraw() {

function assistToggle() {
  chat.open = !chat.open;
  if (chat.open && !chat.msgs.length) chat.msgs.push({ who: 'bot', html: P(`Hi${S.name ? ' ' + esc(S.name) : ''}! 👋 Ask me about your deadlines, exam topics and progress. I only use the data in your planner.`) + `<div class="sugs">${assistStarters().map(sug).join('')}</div>` });
  assistDraw();
  if (chat.open) { const i = document.querySelector('.ask-form input'); if (i && window.innerWidth > 900) i.focus(); }
}
function assistClose() { chat.open = false; assistDraw(); }
function assistAsk(text) {
  text = String(text || '').trim(); if (!text) return;
  chat.open = true;
  chat.msgs.push({ who: 'me', text });
  let html; try { html = assistantAnswer(text); } catch (e) { html = P('Sorry, something went wrong while looking that up.'); }
  chat.msgs.push({ who: 'bot', html });
  assistDraw();
  const i = document.querySelector('.ask-form input'); if (i && window.innerWidth > 900) i.focus();
}

(function mountAssistant() { const b = document.createElement('div'); b.id = 'assistant'; document.body.appendChild(b); assistDraw(); })();

  'course-del': (el) => { if (!confirm('Delete this course? Its exams, tasks and projects stay but lose their course label.')) return; S.courses = S.courses.filter((c) => c.id !== el.dataset.id); view = 'courses'; commit(); },
  'slot-add': (el) => slotForm(el.dataset.id), 'slot-del': (el) => { courseOf(el.dataset.id).slots.splice(Number(el.dataset.i), 1); commit(); },
  'exam-add': (el) => examForm(null, el.dataset.course), 'exam-edit': (el) => examForm(el.dataset.id),
  'exam-del': (el) => { if (!confirm('Delete this exam and its topics?')) return; S.exams = S.exams.filter((e) => e.id !== el.dataset.id); view = 'exams'; commit(); },
  'sub-add': (el) => askText('Add subtopic', 'Subtopic', '', (v) => { const tp = S.exams.find((e) => e.id === el.dataset.id).topics.find((x) => x.id === el.dataset.tid); tp.subs = tp.subs || []; tp.subs.push({ id: uid(), title: v, done: false }); commit(); }),
  'topic-rename': (el) => { const tp = S.exams.find((e) => e.id === el.dataset.id).topics.find((x) => x.id === el.dataset.tid); askText('Rename topic', 'Topic', tp.title, (v) => { tp.title = v; commit(); }); },
  'topic-del': (el) => { const e = S.exams.find((x) => x.id === el.dataset.id); e.topics = e.topics.filter((x) => x.id !== el.dataset.tid); commit(); },
  'sub-del': (el) => { const tp = S.exams.find((e) => e.id === el.dataset.id).topics.find((x) => x.id === el.dataset.tid); tp.subs = tp.subs.filter((s) => s.id !== el.dataset.sid); commit(); },
  'task-add': (el) => { $$('dialog').forEach((d) => d.close()); taskForm(null, el.dataset.course, el.dataset.due); }, 'task-edit': (el) => taskForm(el.dataset.id),
  'task-del': (el) => { S.tasks = S.tasks.filter((t) => t.id !== el.dataset.id); commit(); },
  'proj-add': (el) => projForm(null, el.dataset.course), 'proj-edit': (el) => projForm(el.dataset.id),
  'proj-del': (el) => { if (!confirm('Delete this project?')) return; S.projects = S.projects.filter((p) => p.id !== el.dataset.id); view = 'projects'; commit(); },
  'member-add': (el) => askText('Add team member', 'Name', '', (v) => { S.projects.find((p) => p.id === el.dataset.id).members.push({ id: uid(), name: v }); commit(); }),
  'member-del': (el) => { const p = S.projects.find((x) => x.id === el.dataset.id); p.members = p.members.filter((m) => m.id !== el.dataset.mid); commit(); },
  'ptask-add': (el) => ptaskForm(el.dataset.id), 'ptask-edit': (el) => ptaskForm(el.dataset.id, el.dataset.tid),
  'ptask-del': (el) => { const p = S.projects.find((x) => x.id === el.dataset.id); p.tasks = p.tasks.filter((t) => t.id !== el.dataset.tid); commit(); },
  'li-del': (el) => { S.lists[el.dataset.kind] = S.lists[el.dataset.kind].filter((i) => i.id !== el.dataset.id); commit(); },
  'file-dl': (el) => downloadFile(el.dataset.id), 'file-del': (el) => { if (confirm('Delete this file?')) removeFile(el.dataset.id); },
  course: () => {},
};
const C = {
  'task-toggle': (el) => { const t = S.tasks.find((x) => x.id === el.dataset.id); t.done = el.checked; if (el.checked) confetti(); commit(); },
  'ptask-toggle': (el) => { const p = S.projects.find((x) => x.id === el.dataset.id); p.tasks.find((t) => t.id === el.dataset.tid).done = el.checked; if (el.checked && projProgress(p).p === 100) confetti(); commit(); },
  'li-toggle': (el) => { const i = S.lists[el.dataset.kind].find((x) => x.id === el.dataset.id); i.doneOn = el.checked ? periodKey(el.dataset.kind) : null; if (el.checked && S.lists[el.dataset.kind].every((x) => x.doneOn === periodKey(el.dataset.kind))) confetti(); commit(); },
  'topic-toggle': (el) => {
    const e = S.exams.find((x) => x.id === el.dataset.id), tp = e.topics.find((x) => x.id === el.dataset.tid);
    if (tp.subs && tp.subs.length) tp.subs.forEach((s) => (s.done = el.checked)); else tp.done = el.checked;
    if (el.checked && leaves(e).p === 100) confetti(); commit();
  },
  'sub-toggle': (el) => {
    const e = S.exams.find((x) => x.id === el.dataset.id), tp = e.topics.find((x) => x.id === el.dataset.tid);
    tp.subs.find((s) => s.id === el.dataset.sid).done = el.checked; tp.done = tp.subs.every((s) => s.done);
    if (el.checked && leaves(e).p === 100) confetti(); commit();
  },
};
document.addEventListener('click', (e) => {
  if (bellOpen && !e.target.closest('.panel') && !e.target.closest('[data-act=bell]') && !e.target.closest('[data-act=go]')) { bellOpen = false; render(); }
  const el = e.target.closest('[data-act]');
  if (el && A[el.dataset.act]) { e.stopPropagation(); A[el.dataset.act](el, e); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.chg && C[t.dataset.chg]) C[t.dataset.chg](t);
  else if (t.dataset.upload) { addFiles(t.dataset.upload, [...t.files]); t.value = ''; }
  else if (t.hasAttribute('data-import')) {
    const f = t.files[0]; if (!f) return;
    f.text().then((txt) => {
      const j = JSON.parse(txt); if (!j || !Array.isArray(j.courses)) throw 0;
      if (!confirm('Replace your current data with this backup?')) return;
      S = Object.assign(defaults(), j); $$('dialog').forEach((d) => d.close()); commit();
    }).catch(() => alert('That file is not a valid StudyNest backup.'));
    t.value = '';
  }
});
document.addEventListener('input', (e) => {
  const n = e.target.dataset && e.target.dataset.note; if (!n) return;
  const arr = { course: S.courses, exam: S.exams, project: S.projects }[n]; const o = arr.find((x) => x.id === e.target.dataset.id);
  if (o) { o.notes = e.target.value; save(); }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries()), kind = f.dataset.form, title = (v.title || '').trim();
  if (kind === 'name') { S.name = (v.name || '').trim(); $$('dialog').forEach((d) => d.close()); commit(); }
  else if (kind === 'li-add' && title) { S.lists[f.dataset.kind].push({ id: uid(), title, doneOn: null }); refocus = `form[data-kind="${f.dataset.kind}"] input`; commit(); }
  else if (kind === 'topic-add' && title) { S.exams.find((x) => x.id === f.dataset.id).topics.push({ id: uid(), title, done: false, subs: [] }); refocus = 'form[data-form="topic-add"] input'; commit(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && bellOpen) { bellOpen = false; render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('dialog[open]')) render(); });
render();

</script>
</body>
</html>
